name: Build and Publish Windows Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --icon=assets/icon.ico --add-data "assets;assets" --name TrackPull main.py

      - name: Verify build output
        run: |
          if (!(Test-Path "dist/TrackPull.exe")) {
            Write-Error "dist/TrackPull.exe not found!"
            exit 1
          }
          Get-Item dist/TrackPull.exe | Select-Object Name, Length, LastWriteTime

      - name: Upload artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: dist/TrackPull.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact for manual workflow run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: TrackPull-Windows-Standalone
          path: dist/TrackPull.exe
